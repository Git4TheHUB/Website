<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Batch Asset Downloader</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --card-bg: #2b2b36;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #00b4d8;
            --accent-hover: #0096c7;
            --error: #f74b52;
            --success: #06d6a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 { margin-top: 0; }
        
        p.description {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: #1e1e24;
            border: 2px solid #ccc;
            color: #fff;
            border-radius: 8px;
            padding: 10px;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover { background-color: var(--accent-hover); }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }

        #errorMsg {
            background-color: rgba(247, 75, 82, 0.2);
            color: var(--error);
        }

        #loadMsg {
            background-color: rgba(0, 180, 216, 0.2);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Asset Downloader</h2>
        <p class="description">Paste your Roblox Asset URLs or IDs separated by commas to download them in a batch.</p>
        
        <textarea id="assetURL" placeholder="e.g. 6532975426, 1234567890, https://create.roblox.com/store/asset/..."></textarea>
        
        <button id="submitAsset">Download Assets</button>
        
        <div id="errorMsg" class="message"></div>
        <div id="loadMsg" class="message"></div>
    </div>

    <script>
        // RobloxAsset — fixed, modernized & updated for create.roblox.com
        const CORS_PROXY = "https://cors-anywhere.herokuapp.com/"; [cite: 2]

        // Roblox AssetTypeId → file extension [cite: 3]
        const ASSET_TYPE_EXT = {
            1:  ".png",   2:  ".rbxm",  3:  ".lua",   5:  ".rbxm",  8:  ".rbxm", 
            9:  ".png",   11: ".png",   12: ".png",   13: ".png",   17: ".rbxm", [cite: 3]
            18: ".png",   19: ".rbxm",  21: ".png",   24: ".rbxm",  25: ".rbxm", 
            26: ".rbxm",  27: ".rbxm",  28: ".rbxm",  29: ".rbxm",  30: ".rbxm", 
            38: ".rbxm",  40: ".rbxm", [cite: 4]
            41: ".rbxm",  42: ".rbxm",  43: ".rbxm",  44: ".rbxm",  45: ".rbxm", 
            46: ".rbxm",  47: ".rbxm",  50: ".mp3",   51: ".rbxm",  61: ".ttf", 
            62: ".ttf",   63: ".mp4" [cite: 5]
        };

        // Types where we download the thumbnail image rather than the raw asset
        const IMAGE_TYPES = new Set([1, 9, 11, 12, 13, 18, 21]); [cite: 6]

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("submitAsset").addEventListener("click", processOptions); [cite: 7]
        });

        // ─── ID extraction ────────────────────────────────────────────────────────────
        function extractAssetId(url) {
            const match = url.match(/\/(\d{6,})/); [cite: 8]
            return match ? match[1] : null; [cite: 9]
        }

        // ─── Roblox JSON API calls ─────────────────────────────
        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status} — ${url}`); [cite: 10]
            return res.json(); [cite: 11]
        }

        async function getAssetDetails(assetId) {
            const data = await fetchJSON(`https://economy.roblox.com/v2/assets/${assetId}/details`);
            return { name: data.Name, assetTypeId: data.AssetTypeId }; [cite: 12]
        }

        async function getAssetThumbnailUrl(assetId) {
            const data = await fetchJSON(`https://thumbnails.roblox.com/v1/assets?assetIds=${assetId}&size=420x420&format=Png&isCircular=false`);
            const entry = data?.data?.[0]; [cite: 13]
            if (!entry || entry.state !== "Completed") {
                throw new Error("Thumbnail not yet available — try again in a moment");
            } [cite: 14]
            return entry.imageUrl;
        }

        // ─── Binary download (CORS proxy required) ───────────────────────────────────
        async function fetchBlob(url) {
            const res = await fetch(CORS_PROXY + url);
            if (!res.ok) throw new Error(`HTTP ${res.status} downloading asset`); [cite: 15]
            return res.blob(); [cite: 16]
        }

        // ─── Main entry point (Modified for Batch Processing) ────────────────────────
        async function processOptions() {
            const inputVal = document.getElementById("assetURL").value.trim();

            hideError();
            resetBorders();

            if (!inputVal) {
                markInvalid("assetURL");
                return showError("Please enter at least one Asset ID or URL");
            }

            // Parse the comma-separated list
            const rawInputs = inputVal.split(',').map(s => s.trim()).filter(Boolean);
            const assetIds = [];

            for (const raw of rawInputs) {
                if (/^\d+$/.test(raw)) {
                    assetIds.push(raw); // Direct ID
                } else {
                    const extracted = extractAssetId(raw);
                    if (extracted) assetIds.push(extracted); // Extracted from URL
                }
            }

            if (assetIds.length === 0) {
                markInvalid("assetURL");
                return showError("Could not find valid asset IDs in your input.");
            }

            // Process each extracted ID sequentially
            for (let i = 0; i < assetIds.length; i++) {
                const assetId = assetIds[i];
                showLoadMsg(`Processing Asset ${i + 1} of ${assetIds.length} (ID: ${assetId})...`);

                try {
                    // Step 1: look up name + type via JSON API (no proxy needed) [cite: 22]
                    const { name, assetTypeId } = await getAssetDetails(assetId);
                    const ext = ASSET_TYPE_EXT[assetTypeId] ?? ".bin"; [cite: 23]
                    const filename = sanitizeFilename(name) + ext;

                    changeLoadMsg(`Downloading ${filename}...`);

                    // Step 2: choose source URL based on asset type [cite: 24]
                    let downloadUrl;
                    if (IMAGE_TYPES.has(assetTypeId)) {
                        // For image-type assets, use the CDN thumbnail 
                        downloadUrl = await getAssetThumbnailUrl(assetId);
                    } else {
                        // For everything else [cite: 26]
                        downloadUrl = `https://assetdelivery.roblox.com/v1/asset/?id=${assetId}`;
                    }

                    // Step 3: fetch the blob and trigger browser download [cite: 27]
                    await triggerDownload(downloadUrl, filename);
                    
                    // Add a tiny 1-second delay so the browser doesn't block multi-downloads
                    await new Promise(r => setTimeout(r, 1000));
                } catch (err) {
                    console.error(err);
                    showError(`Error on ID ${assetId}: ` + err.message);
                    await new Promise(r => setTimeout(r, 2000)); // Pause to show error, then continue
                    hideError();
                }
            }

            hideLoadMsg();
            showLoadMsg("All downloads finished!");
            setTimeout(hideLoadMsg, 3000);
        }

        // ─── Download trigger ─────────────────────────────────────────────────────────
        async function triggerDownload(src, filename) {
            const blob   = await fetchBlob(src);
            const anchor = document.createElement("a"); [cite: 30]
            anchor.href  = URL.createObjectURL(blob);
            anchor.setAttribute("download", filename);
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(anchor.href); [cite: 31]
        }

        // ─── Utilities & UI helpers ───────────────────────────────────────────────────
        function sanitizeFilename(name) {
            return (name ?? "unnamed").replace(/[/\\:*?"<>|]/g, "_").trim() || "unnamed";
        }

        function showError(message) {
            const el = document.getElementById("errorMsg");
            el.innerText = message;
            el.style.display = "block";
        }

        function hideError() {
            document.getElementById("errorMsg").style.display = "none";
        }

        function showLoadMsg(message) {
            const el = document.getElementById("loadMsg");
            el.innerText = message;
            el.style.display = "block";
            document.getElementById("submitAsset").style.display = "none";
        }

        function hideLoadMsg() {
            document.getElementById("loadMsg").style.display = "none";
            document.getElementById("submitAsset").style.display = "block";
        }

        function changeLoadMsg(message) {
            document.getElementById("loadMsg").innerText = message;
        }

        function markInvalid(id) {
            document.getElementById(id).style.borderColor = "#f74b52"; [cite: 32]
        }

        function resetBorders() {
            document.getElementById("assetURL").style.borderColor = "#ccc";
        }
    </script>
</body>
</html>
